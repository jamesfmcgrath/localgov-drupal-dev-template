# CI for the custom module developed in this repo.
# Assumes the module lives at {{MODULE_PATH}} in this repository. If your module
# is maintained in its own repo, put this workflow there instead.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Skip everything on the bare template (no composer.json until a project is
  # scaffolded from it), so the template repo does not show a failing CI run.
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          if [ -f composer.json ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false (bare template, nothing to test)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # Runs only on the bare template (composer.json absent), the inverse of the
  # guard above. Gives the template repo itself a green, meaningful CI run
  # instead of a run that skips everything.
  template:
    name: Template regression suite
    needs: guard
    if: needs.guard.outputs.run == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/test-template.sh

  php:
    name: PHP lint, static analysis, tests
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite, sqlite3, mbstring, dom, xml, opcache
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: PHPCS (Drupal, DrupalPractice)
        run: |
          if find {{MODULE_PATH}} -type f -print -quit | grep -q .; then
            vendor/bin/phpcs
          else
            echo "No files found under {{MODULE_PATH}}; skipping phpcs."
          fi

      - name: PHPStan
        run: |
          if find {{MODULE_PATH}} -type f -print -quit | grep -q .; then
            vendor/bin/phpstan analyse --no-progress
          else
            echo "No files found under {{MODULE_PATH}}; skipping phpstan."
          fi

      - name: Twig CS Fixer
        run: |
          if find {{MODULE_PATH}} -name '*.twig' -print -quit | grep -q .; then
            vendor/bin/twig-cs-fixer lint {{MODULE_PATH}}
          else
            echo "No .twig files found under {{MODULE_PATH}}; skipping."
          fi

      - name: PHPUnit (unit + kernel)
        env:
          SIMPLETEST_DB: sqlite://localhost//tmp/db.sqlite
          SYMFONY_DEPRECATIONS_HELPER: weak
        run: |
          dirs=""
          for suite in Unit Kernel; do
            d="{{MODULE_PATH}}/tests/src/$suite"
            [ -d "$d" ] && dirs="$dirs $d"
          done
          if [ -n "$dirs" ]; then
            vendor/bin/phpunit -c web/core $dirs
          else
            echo "No Unit/Kernel tests found under {{MODULE_PATH}}; skipping."
          fi

      - name: Check for JS/CSS/YAML files
        id: frontend_check
        run: |
          if find {{MODULE_PATH}} \( -name '*.js' -o -name '*.yml' -o -name '*.css' \) -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No .js, .yml, or .css files found under {{MODULE_PATH}}; skipping ESLint/Stylelint setup."
          fi

      - name: Set up Node
        if: steps.frontend_check.outputs.found == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Drupal core's frontend dependencies
        if: steps.frontend_check.outputs.found == 'true'
        run: |
          cd web/core
          corepack enable
          yarn install

      - name: ESLint (Drupal core config)
        if: steps.frontend_check.outputs.found == 'true'
        run: |
          if find {{MODULE_PATH}} \( -name '*.js' -o -name '*.yml' \) -print -quit | grep -q .; then
            node web/core/node_modules/.bin/eslint {{MODULE_PATH}} \
              --no-error-on-unmatched-pattern \
              --ignore-pattern='*.es6.js' \
              --resolve-plugins-relative-to=web/core \
              --ext=.js,.yml \
              -c web/core/.eslintrc.passing.json
          else
            echo "No .js or .yml files found under {{MODULE_PATH}}; skipping eslint."
          fi

      - name: Stylelint (Drupal core config)
        if: steps.frontend_check.outputs.found == 'true'
        run: |
          if find {{MODULE_PATH}} -name '*.css' -print -quit | grep -q .; then
            web/core/node_modules/.bin/stylelint --config web/core/.stylelintrc.json "{{MODULE_PATH}}/**/*.css"
          else
            echo "No .css files found under {{MODULE_PATH}}; skipping stylelint."
          fi

  prettier:
    name: Prettier
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Prettier
        run: |
          if find {{MODULE_PATH}} \( -name '*.css' -o -name '*.js' -o -name '*.json' -o -name '*.yml' -o -name '*.yaml' -o -name '*.md' \) -print -quit | grep -q .; then
            npx prettier --check "{{MODULE_PATH}}/**/*.{css,js,json,yml,yaml,md}"
          else
            echo "No matching files found under {{MODULE_PATH}}; skipping prettier."
          fi

      - name: CSpell
        run: |
          if find {{MODULE_PATH}} -type f -print -quit | grep -q .; then
            npx cspell --no-progress "{{MODULE_PATH}}/**"
          else
            echo "No files found under {{MODULE_PATH}}; skipping cspell."
          fi

  # Needs live verification: this job has been validated for YAML syntax only,
  # not run against real CI infrastructure yet. Installing the LocalGov
  # profile in CI is slow and its behaviour under GitHub Actions runners is
  # unproven. If it turns out too slow or flaky here, switch INSTALL_PROFILE
  # to "minimal" for this job only (minimal has no content types by default,
  # so the node-creation step below would need a bundle created first).
  a11y:
    name: Accessibility (axe-core)
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite, sqlite3, mbstring, dom, xml, opcache
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Install site (sqlite)
        timeout-minutes: 20
        continue-on-error: false
        run: |
          vendor/bin/drush si {{INSTALL_PROFILE}} -y \
            --db-url=sqlite://sites/default/files/.ht.sqlite

      - name: Create a node for the accessibility scan
        run: |
          vendor/bin/drush php:eval '
            $bundles = array_keys(\Drupal\node\Entity\NodeType::loadMultiple());
            if (empty($bundles)) {
              fwrite(STDERR, "No content types available; /node/1 will 404.\n");
            }
            else {
              $node = \Drupal\node\Entity\Node::create([
                "type" => reset($bundles),
                "title" => "A11y CI test page",
                "status" => 1,
              ]);
              $node->save();
              echo "Created node " . $node->id() . " (" . reset($bundles) . ")\n";
            }
          '

      - name: Serve the site
        run: |
          vendor/bin/drush rs 127.0.0.1:8888 >/tmp/drush-rs.log 2>&1 &
          echo $! > /tmp/server.pid

          ready=false
          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:8888/ >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" = false ]; then
            echo "drush runserver did not respond; falling back to php -S."
            kill "$(cat /tmp/server.pid)" 2>/dev/null || true
            php -S 127.0.0.1:8888 -t web >/tmp/php-s.log 2>&1 &
            echo $! > /tmp/server.pid
            for i in $(seq 1 15); do
              if curl -sSf http://127.0.0.1:8888/ >/dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 2
            done
          fi

          if [ "$ready" = false ]; then
            echo "Site did not respond on 127.0.0.1:8888." >&2
            cat /tmp/drush-rs.log /tmp/php-s.log 2>/dev/null
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Accessibility scan (axe-core via Playwright)
        run: node scripts/a11y-scan.mjs

      - name: Show server logs
        if: failure()
        run: cat /tmp/drush-rs.log /tmp/php-s.log 2>/dev/null || true
